<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Calendar Top Bar -->
  <rect x="14" y="16" width="36" height="34" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2"/>
  <path d="M14 24 H50" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Calendar Rings -->
  <line x1="22" y1="12" x2="22" y2="18" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="12" x2="42" y2="18" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Medical Cross / Plus Badge in center -->
  <rect x="29" y="30" width="6" height="14" rx="2" fill="url(#accentGrad)"/>
  <rect x="25" y="34" width="14" height="6" rx="2" fill="url(#accentGrad)"/>
</svg>
