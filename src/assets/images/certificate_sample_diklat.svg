<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Background -->
  <rect width="1000" height="700" fill="url(#certBg)"/>
  
  <!-- Border Frames -->
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="url(#goldGrad)" stroke-width="4" rx="16"/>
  <rect x="40" y="40" width="920" height="620" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6,4" rx="12"/>
  
  <!-- Hospital / Org Emblem Header -->
  <circle cx="500" cy="115" r="42" fill="#0f2b48" stroke="url(#goldGrad)" stroke-width="3"/>
  <path d="M500 90 L515 110 L540 115 L522 130 L527 155 L500 142 L473 155 L478 130 L460 115 L485 110 Z" fill="url(#goldGrad)"/>
  
  <!-- Title Texts -->
  <text x="500" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="4">
    SERTIFIKAT PELATIHAN EKSTERNAL
  </text>
  <text x="500" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
