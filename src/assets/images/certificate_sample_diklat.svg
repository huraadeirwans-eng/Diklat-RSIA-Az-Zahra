  </text>
  
  <line x1="620" y1="600" x2="820" y2="600" stroke="#64748b" stroke-width="1.5"/>
  <text x="720" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">
