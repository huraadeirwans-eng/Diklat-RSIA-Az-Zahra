  </text>
  
  <!-- Signatures -->
  <line x1="180" y1="600" x2="380" y2="600" stroke="#64748b" stroke-width="1.5"/>
  <text x="280" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc" text-anchor="middle">
