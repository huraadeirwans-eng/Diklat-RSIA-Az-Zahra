  </text>
  
  <rect x="200" y="415" width="600" height="60" fill="#031124" stroke="#0284c7" stroke-width="1.5" rx="10"/>
  <text x="500" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle">
    STANDARISASI &amp; SERTIFIKASI KOMPETENSI EKSTERNAL
  </text>
  
  <text x="500" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
