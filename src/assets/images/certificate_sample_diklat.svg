  </text>
  
  <line x1="300" y1="345" x2="700" y2="345" stroke="#334155" stroke-width="2"/>
  
  <text x="500" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#e2e8f0" text-anchor="middle" width="700">
