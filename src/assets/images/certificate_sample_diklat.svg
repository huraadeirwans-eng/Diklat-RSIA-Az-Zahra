  </text>
  
  <text x="500" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#cbd5e1" text-anchor="middle">
    Diberikan dengan hormat kepada:
  </text>
  
  <text x="500" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">
